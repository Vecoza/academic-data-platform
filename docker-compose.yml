x-airflow-common: &airflow-common
  image: academic-data-platform-airflow:3.3.2
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB:-airflow}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-development-only}
    AIRFLOW__API_AUTH__JWT_ISSUER: academic-data-platform
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_UNIVERSITY_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW_CONN_WAREHOUSE_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${WAREHOUSE_DB:-warehouse}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16-alpine
    container_name: adp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-init:
    image: academic-data-platform-airflow:3.3.2
    entrypoint: ["bash", "/opt/academic/project/orchestration/bootstrap.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      PLATFORM_STUDENTS: ${PLATFORM_STUDENTS:-15000}
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-database:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$${AIRFLOW_DB}'" | grep -q 1
        || psql -c "CREATE DATABASE \"$${AIRFLOW_DB}\""
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    command:
      - bash
      - -c
      - >-
        airflow db migrate
        && airflow pools set academic_pipeline 1 "One academic pipeline task at a time"
    depends_on:
      airflow-database:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      platform-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard-access:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: academic-data-platform-dashboard:1.0
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      DASHBOARD_USER: ${DASHBOARD_USER:-dashboard_reader}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    command: ["python", "-m", "dashboard.access"]
    depends_on:
      platform-init:
        condition: service_completed_successfully

  dashboard:
    image: academic-data-platform-dashboard:1.0
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      DASHBOARD_USER: ${DASHBOARD_USER:-dashboard_reader}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      dashboard-access:
        condition: service_completed_successfully

volumes:
  pgdata:
  airflow-logs:
