name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academic
          POSTGRES_PASSWORD: adp_local_pw_2026
          POSTGRES_DB: university
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academic -d university"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: adp_local_pw_2026
      POSTGRES_DB: university
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      WAREHOUSE_DB: warehouse
      PGPASSWORD: adp_local_pw_2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[pipeline,dashboard,dev]"

      - name: Lint
        run: ruff check .

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          psql --version

      - name: Create warehouse database
        run: >-
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          -v ON_ERROR_STOP=1 -f docker/init/01_create_warehouse.sql

      - name: Apply migrations
        run: make migrate

      - name: Generate a small history
        run: make generate STUDENTS=200

      - name: Ingest into the raw layer
        run: make ingest-full

      - name: Build and test the warehouse
        run: make dbt-build

      - name: Run quality checks
        run: make quality

      - name: Test
        run: pytest

  dags:
    runs-on: ubuntu-24.04
    env:
      AIRFLOW_VERSION: "3.3.2"
      PYTHON_VERSION: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Airflow with the official constraints
        run: >-
          pip install "apache-airflow==${AIRFLOW_VERSION}" pytest
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

      - name: Test DAGs
        run: pytest -p no:cacheprovider orchestration/tests
