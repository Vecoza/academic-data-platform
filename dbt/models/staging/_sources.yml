version: 2

# Freshness is measured on _loaded_at, the time a new row version reached raw. It only moves
# when a table changes, so each table's thresholds follow how often it changes in the source:
# students change every day (contact corrections), activity tables can be quiet between the
# start of a semester and its exams, and reference tables change too rarely to be checked.
sources:
  - name: raw
    description: Operational tables copied by the ingestion pipeline. Every version of a row is kept.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 14, period: day}
        error_after: {count: 30, period: day}
    tables:
      - name: students
        config:
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
      - name: student_programs
      - name: enrollments
      - name: exam_attempts
      - name: faculties
        config:
          freshness: null
      - name: programs
        config:
          freshness: null
      - name: professors
        config:
          freshness: null
      - name: semesters
        config:
          freshness: null
      - name: courses
        config:
          freshness: null
      - name: course_prerequisites
        config:
          freshness: null
      - name: course_offerings
        config:
          freshness: null
      - name: exam_terms
        config:
          freshness: null
