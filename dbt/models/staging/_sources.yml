version: 2

sources:
  - name: raw
    description: Operational tables copied by the ingestion pipeline. Every version of a row is kept.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: faculties
      - name: programs
      - name: professors
      - name: semesters
      - name: courses
      - name: course_prerequisites
      - name: students
      - name: student_programs
      - name: course_offerings
      - name: enrollments
      - name: exam_terms
      - name: exam_attempts
